<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 위치 속성</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        p {
            width: 300px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        #pos1 {
            position: absolute;
            left: 50px;
            top: 50px;
        }
        #pos2 {
            position: absolute;
            right: 100px;
            top: 100px;
        }
        #pos3 {
            position: absolute;
            left: 100px;
            bottom: 100px;
        }
    </style>
</head>
<body>
    <p id="pos1">Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    <p id="pos2">Commodi, maiores explicabo id totam distinctio ut perspiciatis temporibus autem minima quos?</p>
    <p id="pos3">nihil natus voluptatem sequi? Provident sit itaque possimus ratione unde?</p>
</body>
</html>
