<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델</title>
    <style>
        h1 {
            padding-bottom: 5px;
            border-bottom: 3px solid rgb(75, 70, 70);
        }
        p {
            padding: 10px;
            border: 3px dotted blue;
        }
        .round {
            border-radius: 25px;
        }
        .circle {
            border-radius: 50%;
        }
        .corner {
            border: 2px solid blue;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px; 
        }

    </style>
</head>
<body>
    <h1>박스 모델</h1>
    <p class="round">박스 모델은 실제 컨텐츠 영역, 박스와 컨텐츠 영역 사이의 여백인 패팅,
        박스의 테두리, 그리고 여러 박스 모델 간의 여백인 마진 등의 요소로 구성되어 있습니다.
    </p>
    <img src="images/cat.jpg" class="circle">
    <img src="images/cat.jpg" class="corner">
</body>
</html>
