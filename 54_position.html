<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 위치 속성</title>
    <style>
        p {
            width: 500px;
            height: 200px;
            background-color: #eee;
            border: 1px solid #ccc;
            line-height: 2; 
        }
        #static {
            position: static;
        }
        #relative-1 {
            position: relative;
        }
        #relative-2 {
            position: relative;
            left: 100px;
            top: -50px;
        }
        #fixed {
            width: 100px;
            height: 100px;
            background-color: #222;
            position: fixed;
            right: 30px;
            top: 30px;
        }
    </style>
</head>
<body>
    <p id="static">Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    <p id="relative-1">Commodi, maiores explicabo id totam distinctio ut perspiciatis temporibus autem minima quos?</p>
    <p id="relative-2">nihil natus voluptatem sequi? Provident sit itaque possimus ratione unde?</p>
    <p id="fixed"></p>
</body>
</html>
