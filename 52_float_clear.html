<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델</title>
    
    <style>
        .wrapper {
            width: 800px;
            margin: 10px auto;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .sidebar {
            width: 150px;
            height: 150px;
        }
        #left {
            background: #ffd800;
            float: left;
            margin-right: 10px;
        }
        #right {
            background: #0094ff;
            float: right;
            margin-left: 10px;
        }
        .clear {
            clear: both;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar" id="left">박스1</div>
        <div class="sidebar" id="right">박스2</div>
        <p>Consequuntur dignissimos doloribus nesciunt cumque tempore atque, eum, animi veritatis et voluptate impedit.</p>
        <p class="clear">Lorem ipsum dolor, sit amet consectetur adipisicing elit.</p>
</body>
</html>
