<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델 - 마진</title>
    <style>
        * {
            box-sizing: border-box;
        }
        div {
            width: 200px;
            height: 100px;
            margin: 30px;
        }
        #margin1 {
            background: rgb(0,75,100);
        }
        #margin2 {
            background: rgb(140, 197, 216);
        }
        #margin3 {
            background: rgb(215, 231, 143);
        }

    </style>
</head>
<body>
    <div id="margin1"></div>
    <div id="margin2"></div>
    <div id="margin3"></div>
</body>
</html>
